# Local development stack. Credentials below are for local demo use only;
# all ports bind to 127.0.0.1.
name: aperture

x-demo: &demo
  build: .
  entrypoint: ["/usr/local/bin/demo"]
  command: []
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    interval: 5s
    timeout: 3s
    retries: 10
  depends_on:
    collector:
      condition: service_started

x-demo-env: &demo-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_BSP_SCHEDULE_DELAY: "1000" # export every second so traces appear quickly

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: aperture
      POSTGRES_DB: aperture
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperture -d aperture"]
      interval: 2s
      timeout: 3s
      retries: 30

  aperture:
    build: .
    environment:
      APERTURE_DATABASE_URL: postgres://aperture:aperture@postgres:5432/aperture?sslmode=disable
      APERTURE_HTTP_ADDR: ":8080"
      APERTURE_LOG_LEVEL: info
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 40s

  collector:
    image: otel/opentelemetry-collector:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      aperture:
        condition: service_healthy

  web:
    build: ./web
    environment:
      APERTURE_API_URL: http://aperture:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      aperture:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/services"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Demo shop: instrumented microservices + simulated users ----
  gateway:
    <<: *demo
    environment:
      <<: *demo-env
      DEMO_ROLE: gateway
      CATALOG_URL: http://catalog:8080
      CHECKOUT_URL: http://checkout:8080
    ports:
      - "127.0.0.1:9000:8080"
  catalog:
    <<: *demo
    environment:
      <<: *demo-env
      DEMO_ROLE: catalog
      FAULT_SLOW_RATE: "0.03"
      FAULT_SLOW_MS: "250"
  checkout:
    <<: *demo
    environment:
      <<: *demo-env
      DEMO_ROLE: checkout
      CATALOG_URL: http://catalog:8080
      INVENTORY_URL: http://inventory:8080
      PAYMENTS_URL: http://payments:8080
  inventory:
    <<: *demo
    environment:
      <<: *demo-env
      DEMO_ROLE: inventory
      FAULT_ERROR_RATE: "0.01"
  payments:
    <<: *demo
    environment:
      <<: *demo-env
      DEMO_ROLE: payments
      FAULT_ERROR_RATE: "0.05"
      FAULT_SLOW_RATE: "0.05"
      FAULT_SLOW_MS: "400"
  traffic:
    <<: *demo
    environment:
      <<: *demo-env
      DEMO_ROLE: traffic
      GATEWAY_URL: http://gateway:8080
      TRAFFIC_RPS: "5"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
